<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registro de las operaciones relevantes del sistema. Solo para el administrador.">
  <title>Historial de operaciones · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="/">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor" id="contenido">
    <h1>Historial de operaciones</h1>
    <p class="subtitulo">Registro de lo que ocurre en el sistema (solo administrador).</p>

    <form id="formFiltros" class="filtros" aria-label="Filtrar el historial">
      <div class="campo">
        <label for="fAccion">Acción</label>
        <select id="fAccion" name="fAccion">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="campo">
        <label for="fFecha">Fecha</label>
        <input id="fFecha" name="fFecha" type="date">
      </div>
      <div class="campo">
        <label for="fTexto">Usuario o detalle</label>
        <input id="fTexto" name="fTexto" type="search" autocomplete="off">
      </div>
      <div class="botones">
        <button type="button" id="btnLimpiar" class="btn secundario">Limpiar</button>
        <button type="button" id="btnActualizar" class="btn">Actualizar</button>
      </div>
    </form>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    <p id="contador" class="contador" aria-live="polite"></p>

    <div class="tabla">
      <table>
        <caption class="sr-only">Operaciones registradas</caption>
        <thead>
          <tr>
            <th scope="col">Fecha</th>
            <th scope="col">Usuario</th>
            <th scope="col">Acción</th>
            <th scope="col">Entidad</th>
            <th scope="col">ID</th>
            <th scope="col">Detalle</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web · UNIAJC</p>
  </footer>

  <script src="/js/comun.js"></script>
  <script src="/js/historial.js"></script>
</body>
</html>
