<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea, edita, publica y cancela tus eventos, revisa los inscritos y registra la asistencia.">
  <title>Panel del organizador · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="/">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor" id="contenido">
    <h1>Panel del organizador</h1>
    <p class="subtitulo">Gestiona tus eventos, revisa los inscritos y registra la asistencia.</p>

    <section class="tarjeta" aria-labelledby="tituloForm">
      <h2 id="tituloForm" style="margin-top:0">Crear evento</h2>
      <form id="formEvento">
        <div class="form-grid">
          <div class="campo">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" maxlength="150" required>
          </div>
          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecciona una categoría</option>
            </select>
          </div>
          <div class="campo">
            <label for="modalidad">Modalidad</label>
            <select id="modalidad" name="modalidad" required>
              <option value="PRESENCIAL">Presencial</option>
              <option value="VIRTUAL">Virtual</option>
              <option value="HIBRIDA">Híbrida</option>
            </select>
          </div>
          <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
          </div>
          <div class="campo">
            <label for="horaInicio">Hora de inicio</label>
            <input id="horaInicio" name="horaInicio" type="time" required>
          </div>
          <div class="campo">
            <label for="horaFin">Hora de fin</label>
            <input id="horaFin" name="horaFin" type="time" required>
          </div>
          <div class="campo">
            <label for="ubicacion">Ubicación o enlace</label>
            <input id="ubicacion" name="ubicacion" type="text" maxlength="200">
          </div>
          <div class="campo">
            <label for="cupo">Cupo</label>
            <input id="cupo" name="cupo" type="number" min="1" required>
          </div>
          <div class="campo completo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" maxlength="2000"></textarea>
          </div>
        </div>
        <div class="acciones-form">
          <button type="submit" id="btnGuardar" class="btn">Crear evento</button>
          <button type="button" id="btnCancelarEdicion" class="btn secundario" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

    <section aria-labelledby="tituloEventos">
      <h2 id="tituloEventos">Mis eventos</h2>
      <div class="tabla">
        <table>
          <caption class="sr-only">Lista de eventos</caption>
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">Fecha</th>
              <th scope="col">Modalidad</th>
              <th scope="col">Cupo</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>

    <section id="inscritos" aria-live="polite"></section>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web · UNIAJC</p>
  </footer>

  <script src="/js/comun.js"></script>
  <script src="/js/organizador.js"></script>
</body>
</html>
