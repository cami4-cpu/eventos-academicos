<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea una cuenta de participante para inscribirte en los eventos académicos.">
  <title>Crear cuenta · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="/">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor estrecho" id="contenido">
    <section class="tarjeta" aria-labelledby="titulo">
      <h1 id="titulo">Crear cuenta</h1>
      <p class="subtitulo">Regístrate para inscribirte en los eventos.</p>

      <form id="formRegistro">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="ayuda-clave">
          <span id="ayuda-clave" class="ayuda">Mínimo 8 caracteres.</span>
        </div>
        <button type="submit" class="btn ancho">Registrarme</button>
      </form>

      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

      <p>¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>
      <p><a href="/">Volver al catálogo</a></p>
    </section>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web · UNIAJC</p>
  </footer>

  <script src="/js/comun.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
