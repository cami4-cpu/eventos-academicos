<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta tus inscripciones activas e históricas y cancela las que ya no necesites.">
  <title>Mis inscripciones · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="/">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor" id="contenido">
    <h1>Mis inscripciones</h1>
    <p class="subtitulo">Tus inscripciones activas y el historial de las canceladas.</p>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

    <div class="tabla">
      <table>
        <caption class="sr-only">Lista de mis inscripciones</caption>
        <thead>
          <tr>
            <th scope="col">Evento</th>
            <th scope="col">Fecha</th>
            <th scope="col">Hora</th>
            <th scope="col">Lugar</th>
            <th scope="col">Estado</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web · UNIAJC</p>
  </footer>

  <script src="/js/comun.js"></script>
  <script src="/js/mis-inscripciones.js"></script>
</body>
</html>
