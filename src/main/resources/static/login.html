<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 360px; margin: 60px auto; padding: 0 12px; }
    form { display: grid; gap: 10px; }
    input, button { padding: 8px; }
    #mensaje { color: crimson; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Iniciar sesión</h1>
  <form id="formLogin">
    <input id="email" type="email" placeholder="Correo" required>
    <input id="password" type="password" placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
  </form>
  <div id="mensaje"></div>
    <p>¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
  <p><a href="/">Volver al catálogo</a></p>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const cuerpo = new URLSearchParams();
      cuerpo.append('email', document.getElementById('email').value);
      cuerpo.append('password', document.getElementById('password').value);
      const res = await fetch('/api/auth/login', { method: 'POST', body: cuerpo });
      if (res.ok) {
        window.location.href = '/organizador.html';
      } else {
        document.getElementById('mensaje').textContent = 'Correo o contraseña incorrectos.';
      }
    });
  </script>
</body>
</html>
