<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicia sesión para inscribirte en eventos académicos o gestionar los tuyos.">
  <title>Iniciar sesión · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="/">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor estrecho" id="contenido">
    <section class="tarjeta" aria-labelledby="titulo">
      <h1 id="titulo">Iniciar sesión</h1>
      <p class="subtitulo">Entra con tu correo y tu contraseña.</p>

      <form id="formLogin">
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn ancho">Entrar</button>
      </form>

      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

      <p>¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
      <p><a href="/">Volver al catálogo</a></p>
    </section>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web  UNIAJC</p>
		<p>Profesor 5.0</p>
  </footer>

  <script src="/js/comun.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
