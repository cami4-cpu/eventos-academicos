<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta los eventos académicos publicados, filtra por categoría, modalidad o fecha e inscríbete.">
  <title>Catálogo de eventos · Eventos académicos UNIAJC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/main/resources/static/css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-in">
      <a class="marca" href="index.html">
        <span class="marca-icono" aria-hidden="true">🎓</span>
        <span>Eventos académicos</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="contenedor" id="contenido">
    <h1>Catálogo de eventos</h1>
    <p class="subtitulo">Encuentra un evento, revisa los cupos disponibles e inscríbete.</p>

    <form id="formFiltros" class="filtros" role="search" aria-label="Filtrar eventos">
      <div class="campo">
        <label for="q">Buscar por título</label>
        <input id="q" name="q" type="search" placeholder="Ej.: Spring Boot" autocomplete="off">
      </div>
      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <div class="campo">
        <label for="modalidad">Modalidad</label>
        <select id="modalidad" name="modalidad">
          <option value="">Todas las modalidades</option>
          <option value="PRESENCIAL">Presencial</option>
          <option value="VIRTUAL">Virtual</option>
          <option value="HIBRIDA">Híbrida</option>
        </select>
      </div>
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input id="fecha" name="fecha" type="date">
      </div>
      <div class="botones">
        <button type="submit" class="btn">Buscar</button>
        <button type="button" id="limpiar" class="btn secundario">Limpiar</button>
      </div>
    </form>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

    <section id="lista" class="rejilla" aria-label="Eventos disponibles" aria-live="polite"></section>
  </main>

  <footer class="pie">
    <p>Proyecto de Fundamentos Web · UNIAJC</p>
  </footer>

  <script src="src/main/resources/static/js/comun.js"></script>
  <script src="src/main/resources/static/js/index.js"></script>
</body>
</html>
